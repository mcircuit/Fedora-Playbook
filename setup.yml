---
- name: Fedora GNOME44 post-install setup
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - vars.yml

  pre_tasks:
    - name: Safety check — refuse to run on unexpected machine
      ansible.builtin.fail:
        msg: "ansible_facts['hostname']={{ ansible_facts['hostname'] }} is not in allowed_hostnames={{ allowed_hostnames }}. Edit vars.yml if hostname changed."
      when: ansible_facts['hostname'] not in allowed_hostnames

  handlers:
    - name: Regenerate GRUB config
      ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
      changed_when: false

  tasks:
    # Section 1 — Bootstrap (idempotent)
    - name: Ensure ansible-core is installed
      ansible.builtin.dnf:
        name: ansible-core
        state: present
    - name: Ensure required collections are installed
      ansible.builtin.command: ansible-galaxy collection install -r requirements.yml
      args:
        chdir: "{{ playbook_dir }}"
      changed_when: false
    # Section 2 — System Prep
    - name: Install RPM Fusion release packages
      ansible.builtin.dnf:
        name:
          - "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
          - "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present
        disable_gpg_check: true
    - name: Install base tools
      ansible.builtin.dnf:
        name:
          - git
          - wget
          - curl
          - pipx
          - dnf-plugins-core
        state: present
    - name: Enable RPM Fusion repositories
      community.general.dnf_config_manager:
        name:
          - rpmfusion-free
          - rpmfusion-nonfree
        state: enabled
    - name: Add Flathub remote
      community.general.flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    - name: Upgrade all installed packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
      # noqa: package-latest
    - name: Remove ffmpeg-free (preparation for full-codec swap)
      ansible.builtin.dnf:
        name: ffmpeg-free
        state: absent
    - name: Install ffmpeg (full codec set from RPM Fusion)
      ansible.builtin.dnf:
        name: ffmpeg
        state: present
        allowerasing: true
    - name: Install @core group packages
      ansible.builtin.dnf:
        name: "@core"
        state: present
    - name: Check for firmware updates (informational, read-only)
      ansible.builtin.command: fwupdmgr get-updates
      register: fwupd_available
      changed_when: false
      failed_when: false
    - name: Install firmware updates
      ansible.builtin.command: fwupdmgr update --assume-yes
      when: fwupd_available is succeeded
      changed_when: false
      failed_when: false
    - name: Install NVIDIA proprietary driver (akmods + CUDA)
      ansible.builtin.dnf:
        name:
          - akmod-nvidia
          - xorg-x11-drv-nvidia-cuda
        state: present

    # Section 2a — Hardware tweaks (GRUB backlight fix)
    - name: Configure GRUB for backlight control
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="rhgb quiet acpi_backlight=native rd.driver.blacklist=nouveau,nova_core modprobe.blacklist=nouveau,nova_core"'
        backup: true
      register: grub_change
      notify: Regenerate GRUB config

    # Section 2b — Docker CE install + user setup
    - name: Remove any pre-existing docker packages
      ansible.builtin.dnf:
        name:
          - docker
          - docker-client
          - docker-client-latest
          - docker-common
          - docker-latest
          - docker-latest-logrotate
          - docker-logrotate
          - docker-selinux
          - docker-engine-selinux
          - docker-engine
        state: absent
    - name: Add Docker CE repository
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE Stable
        baseurl: https://download.docker.com/linux/fedora/$releasever/$basearch/stable
        enabled: true
        gpgcheck: true
        gpgkey:
          - https://download.docker.com/linux/fedora/gpg
    - name: Install Docker CE packages
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
    - name: Enable and start Docker daemon
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started
    - name: Ensure docker group exists
      ansible.builtin.group:
        name: docker
        state: present
    - name: Add user to docker group (logout/login required to take effect)
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: true

    # Section 2c — Vivaldi native RPM install (replaces Flatpak)
    - name: Add Vivaldi browser repository
      ansible.builtin.yum_repository:
        name: vivaldi
        description: Vivaldi browser
        baseurl: https://repo.vivaldi.com/archive/vivaldi/fedora/$releasever/$basearch
        enabled: true
        gpgcheck: true
        gpgkey:
          - https://repo.vivaldi.com/archive/linux_signing_key.pub
    - name: Install Vivaldi (native RPM, avoids Flatpak sandboxing issues)
      ansible.builtin.dnf:
        name: vivaldi-stable
        state: present

    # Section 3 — DNF Packages from Auto-Dump
    - name: Read user-installed package list
      ansible.builtin.slurp:
        path: "{{ playbook_dir }}/lists/dnf-userinstalled.txt"
      register: packages_dnf_raw
    - name: Install user-installed DNF packages from dump
      ansible.builtin.dnf:
        name: "{{ packages_dnf_raw.content | b64decode | split('\n') | select | list }}"
        state: present
      failed_when: false
      # noqa: ignore-errors
      # Section 4 — Flatpak Packages from Auto-Dump
    - name: Read system Flatpak list
      ansible.builtin.slurp:
        path: "{{ playbook_dir }}/lists/flatpak-system.txt"
      register: flatpak_system_raw
    - name: Install system Flatpaks
      community.general.flatpak:
        name: "{{ flatpak_system_raw.content | b64decode | split('\n') | select | list }}"
        state: present
        method: system
      when: (flatpak_system_raw.content | b64decode | split('\n') | select | list | length) > 0
      failed_when: false
      # noqa: ignore-errors
    - name: Read user Flatpak list
      ansible.builtin.slurp:
        path: "{{ playbook_dir }}/lists/flatpak-user.txt"
      register: flatpak_user_raw
    - name: Install user Flatpaks
      community.general.flatpak:
        name: "{{ flatpak_user_raw.content | b64decode | split('\n') | select | list }}"
        state: present
        method: user
      become: true
      become_user: "{{ target_user }}"
      when: (flatpak_user_raw.content | b64decode | split('\n') | select | list | length) > 0
      failed_when: false
      # noqa: ignore-errors

    # Signal flatpak override (must run AFTER Signal is installed by the dump loop)
    - name: Configure Signal to use GNOME keyring for password store
      ansible.builtin.command: flatpak override --env=SIGNAL_PASSWORD_STORE=gnome-libsecret org.signal.Signal
      become: true
      become_user: "{{ target_user }}"
      changed_when: false
      failed_when: false
